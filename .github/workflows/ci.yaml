---
name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  php-versions:
    name: Supported PHP versions
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - id: versions
        shell: bash
        env:
          PHP_RELEASES_URL: https://www.php.net/releases/active.php
        run: |
          versions=$(curl --fail --silent --show-error --retry 3 --retry-all-errors "$PHP_RELEASES_URL" \
            | jq --compact-output '[.[] | keys[]] | sort_by(split(".") | map(tonumber))') \
            || { echo "::error::Cannot read the supported PHP versions from $PHP_RELEASES_URL"; exit 1; }
          if [ "$(jq length <<< "$versions")" -eq 0 ]; then
            echo "::error::$PHP_RELEASES_URL lists no supported PHP version"
            exit 1
          fi
          echo "Supported PHP versions: $versions"
          echo "versions=$versions" >> "$GITHUB_OUTPUT"

  tests:
    name: Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)
    needs: php-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ${{ fromJSON(needs.php-versions.outputs.versions) }}
        dependencies:
          - highest
          - lowest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none
      - run: composer update --no-interaction --no-progress ${{ matrix.dependencies == 'lowest' && '--prefer-lowest --prefer-stable' || '' }}
      # Not run with the lowest dependencies, as it was not on CircleCI.
      - if: matrix.dependencies == 'highest'
        run: composer tests -vvv
      - run: bin/doc > /dev/null
      - run: composer run php-cs-fixer
        env:
          PHP_CS_FIXER_IGNORE_ENV: 1

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: env
        run: cat .env >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.env.outputs.PHP_MIN_VERSION }}
          tools: composer:v2
          coverage: none
      - run: composer update --no-interaction --no-progress
      - name: Check that README.md is up to date
        run: bin/doc | diff -u README.md - || (echo "Documentation is outdated. Run 'bin/doc > README.md'" && exit 1)

  release-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npx semantic-release --dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - tests
      - documentation
      - release-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
